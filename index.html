<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Painel de Alunos</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Painel de alunos</h1>
            <p>Demonstração de CRUD frontend/backend (Node.js)</p>

            <button
                type="button"
                onclick="window.print()"
                style="margin-top:1rem;padding:10px 20px;font-weight:bold;cursor:pointer;border-radius:8px;border:none;background:white;color:var(--primary-color);"
            >
                ⬇️ Baixar PDF
            </button>
        </header>

        <main>
            <section class="form-section">
                <h2 id="form-title">Novo Aluno</h2>

                <form id="aluno-form">
                    <input type="hidden" id="aluno-id">

                    <div class="input-group">
                        <label for="nome">Nome completo</label>
                        <input
                            type="text"
                            id="nome"
                            required
                            placeholder="Ex: João da Silva"
                        >
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            required
                            placeholder="Ex: joao@email.com"
                        >
                    </div>

                    <div class="input-group">
                        <label for="numero">Número de telefone</label>
                        <input
                            type="tel"
                            id="numero"
                            placeholder="Ex: (00) 90000-0000"
                        >
                    </div>

                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input
                            type="text"id="cpf"
                            placeholder="Ex: 000.000.000-00"
                        >
                    </div>

                    <div class="input-group">
                        <label for="curso">Curso</label>
                        <select id="curso" required>
                            <option value="">Selecione um curso...</option>
                            <option value="analise de sistemas">Análise de Sistemas</option>
                            <option value="engenharia de software">Engenharia de Software</option>
                            <option value="Ciencia da computação">Ciência da Computação</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button
                            type="button"
                            class="btn-cancel"
                            id="btn-cancel"
                            style="display:none;"
                        >
                            Cancelar edição
                        </button>

                        <button type="submit" class="btn-save" id="btn-save">
                            Salvar aluno
                        </button>
                    </div>
                </form>
            </section>

            <section class="list-section">
                <h2>Alunos cadastrados</h2>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Curso</th>
                                <th>CPF</th>
                                <th>Número</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="alunos-tbody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
